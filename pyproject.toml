[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LungViZ"
version = "0.2.0"
description = "Interactive Polyscope viewer for OpenCMISS EX meshes and fields"
readme = "README.rst"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "LungViZ contributors"}]
dependencies = [
  "numpy>=1.23",
  "polyscope>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
lungviz = "LungViZ.application:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

